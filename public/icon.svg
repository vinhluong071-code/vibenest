<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">VibeNest Wave Smile</title>
  <desc id="desc">White audio waveform above a neon pink-to-violet double-line smile on an obsidian background.</desc>
  <defs>
    <linearGradient id="smile" x1="90" y1="280" x2="430" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F43F5E"/><stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <filter id="neon" x="-35%" y="-55%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#08080E"/>
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <path d="M92 176h42l23-42 33 88 35-119 38 145 34-92 28 54h95" stroke-width="17"/>
  </g>
  <g fill="none" stroke="url(#smile)" stroke-linecap="round" filter="url(#neon)">
    <path d="M105 302c65 85 145 128 151 128s86-43 151-128" stroke-width="18"/>
    <path d="M145 320c38 42 78 65 111 65s73-23 111-65" stroke-width="10" opacity=".95"/>
  </g>
</svg>