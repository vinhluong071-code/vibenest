<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08080e" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>VibeNest</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #08080e; color: #f4f3f7; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { max-width: 28rem; text-align: center; }
      p { color: #aaa6b8; line-height: 1.6; }
      a { color: #c4b5fd; }
    </style>
    <script>
      (function () {
        var productionOrigin = "https://omni.id.vn";
        var target = productionOrigin + window.location.pathname + window.location.search + window.location.hash;
        if (window.location.origin !== productionOrigin) {
          window.location.replace(target);
        }
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>VibeNest</h1>
      <p>Đang mở không gian VibeNest…</p>
      <p>Nếu trang không tự chuyển, <a href="https://omni.id.vn">mở VibeNest tại omni.id.vn</a>.</p>
    </main>
  </body>
</html>
