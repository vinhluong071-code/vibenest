name: VibeNest Capacitor APK and AAB

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "capacitor-web/**"
      - "capacitor.config.ts"
      - "android/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/capacitor-production-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibenest-capacitor-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck, lint and build the Next.js application
        run: |
          npm run typecheck
          npm run lint
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_check

      - name: Stage Capacitor entry point without affecting Next.js public assets
        run: |
          test -s capacitor-web/index.html
          grep -q 'https://omni.id.vn' capacitor-web/index.html
          mkdir -p public
          cp capacitor-web/index.html public/index.html
          test -s public/index.html

      - name: Synchronize Android native project
        run: npx cap sync android

      - name: Build debug APK and AAB
        working-directory: android
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:bundleDebug

      - name: Verify generated bundle files
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/bundle/debug/app-debug.aab
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/vibenest-debug.apk
          cp android/app/build/outputs/bundle/debug/app-debug.aab artifacts/vibenest-debug.aab
          sha256sum artifacts/* | tee artifacts/SHA256SUMS.txt

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: vibenest-android-debug-apk-aab-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
