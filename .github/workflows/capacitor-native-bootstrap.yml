name: VibeNest Capacitor bootstrap (Linux-first)

# Native packaging is paused during product-core work. Manual dispatch is retained for a later release window.
on:
  workflow_dispatch:

permissions:
  contents: write

# A new commit supersedes an older pending bootstrap run in this group.
concurrency:
  group: vibenest-capacitor-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Generate and synchronize native projects
        run: bash scripts/capacitor-native-bootstrap.sh

      - name: Build unsigned Android debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Validate TypeScript, ESLint and Next.js production build
        run: |
          npm run typecheck
          npm run lint
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://vibenest-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_check

      - name: Commit native projects and lockfile
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json android ios scripts/capacitor-native-bootstrap.sh .github/workflows/capacitor-native-bootstrap.yml
          if git diff --cached --quiet; then
            echo "No generated native changes to commit."
          else
            git commit -m "build: validate Capacitor native projects [skip ci]"
            git push origin "HEAD:${BRANCH_NAME}"
          fi

      - name: Upload unsigned debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vibenest-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
