name: VibeNest camera-first quality
on:
  push:
    branches:
      - feat/vibenest-camera-first-social-ui
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - feat/nextjs-app-router-port
      - feat/hybrid-mobile-navigation-pwa-capacitor
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vibenest-camera-first-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_check
      - name: ESLint
        run: npm run lint
      - name: Next.js production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_check
      - name: Package complete source tree with Python
        run: python3 scripts/create-source-zip.py
      - name: Upload iPhone-downloadable source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: vibenest-source-code
          path: artifacts/vibenest-source.zip
          if-no-files-found: error
          retention-days: 14
